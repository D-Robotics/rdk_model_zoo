    sample_id: himloco
    variant_id: himloco-go2-bayese
    display_name: HIMLoco Go2 Python Runtime
    asset_filename: himloco_go2_bayese_1x270.bin
    input: { shape: [ 1, 270, 1, 1 ], format: float32 }
    environment: { hardware: RDK X5, rdk_os: 3.5.0-beta, runtime: hbm_runtime }
    performance:
      - { metric: latency, value: 0.885, unit: ms, qualifier: exact, statistic: mean, scope: "synchronous HB_HBMRuntime.run; 100 inputs; 10 warm-up runs" }
      - { metric: throughput, value: 1129.37, unit: fps, qualifier: exact, scope: "sequential; 100 inputs; 10 warm-up runs" }
    accuracy:
      - { metric: cosine_similarity, value: 0.999606, unit: ratio, qualifier: exact, model_stage: quantized, scope: "MIX PTQ compilation output" }
