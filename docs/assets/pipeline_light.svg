<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img" aria-label="BPU Deployment Workflow: Export, Quantize, Run on Board, Evaluate">
  <rect x="1" y="1" width="1198" height="146" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Step 1 -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="256" height="104" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#94A3B8">01 / PREPARE</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">Export to ONNX</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">PyTorch / HF checkpoints → ONNX</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="290" y1="74" x2="314" y2="74"/>
    <polyline points="308,68 315,74 308,80"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(324, 22)">
    <rect x="0" y="0" width="256" height="104" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#94A3B8">02 / COMPILE</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">Quantize for BPU</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">OpenExplorer PTQ → .bin / .hbm</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="590" y1="74" x2="614" y2="74"/>
    <polyline points="608,68 615,74 608,80"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(624, 22)">
    <rect x="0" y="0" width="256" height="104" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#F05023">03 / DEPLOY</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">Run on RDK Board</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569">Python hbm_runtime or Native C++</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="890" y1="74" x2="914" y2="74"/>
    <polyline points="908,68 915,74 908,80"/>
  </g>

  <!-- Step 4 -->
  <g transform="translate(924, 22)">
    <rect x="0" y="0" width="252" height="104" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#94A3B8">04 / VERIFY</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">Benchmark &amp; Ship</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">Accuracy, FPS &amp; latency validation</text>
  </g>
</svg>
