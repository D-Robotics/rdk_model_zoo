model_parameters:
  onnx_model: source/encoder.onnx
  march: nash-e
  output_model_file_prefix: paraformer_encoder_int16
  working_dir: compiled/encoder
input_parameters:
  input_name: speech
  input_shape: 1x400x560
  input_type_rt: featuremap
  input_type_train: featuremap
  input_layout_train: NCHW
  separate_batch: false
calibration_parameters:
  cal_data_dir: calibration/speech
  calibration_type: max
  quant_config:
    model_config:
      all_node_type: int16
      activation:
        calibration_type: max
compiler_parameters:
  optimize_level: O2
  compile_mode: latency
  core_num: 1
  jobs: 32
  cache_mode: disable
