name: host-validation

# Maintainer host gate: the complete supported host suites (all 52 native
# samples plus nested conversion/evaluator suites, shared suites including
# the safe parent-repo VLA gitlink integrity guard test_vla_integration.py
# — gitlinks stay uninitialized and upstream ACT/Pi0 code is never run,
# board_validation, the contract checker's own tests, skills), the static
# sample contract, the host-safe native CTest projects and the catalog
# check — one run of utils/tools/host_validation/run.py per matrix leg.
#
# Equivalent gates for develop/main pushes and pull requests: no path
# filters, no migration-state scope decisions, reports uploaded even on
# failure.  The report and its artifacts are written under $RUNNER_TEMP,
# never into the checkout: the runner gates on source content identity, so
# workspace-local reports would be self-induced source drift.  Linux
# results are proven by these jobs; a green local run is not a CI claim.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-validation:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.12"
          # Applicable macOS host coverage: the portable native dependency
          # discovery (iconv/gflags/json) and the host suites must hold on a
          # second platform; board execution is never claimed here.
          - os: macos-15
            python-version: "3.12"
    steps:
      - name: Check out repository (full history, no submodules)
        uses: actions/checkout@v4
        with:
          # Pinned historical sources (utils/py_utils/legacy_platforms.py,
          # the Gemma native CMake pin, catalog commit sources) read Git
          # objects, so the run requires complete history.  The VLA ACT/Pi0
          # gitlinks stay uninitialized by design.
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native host dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libopencv-dev \
            libgflags-dev \
            nlohmann-json3-dev \
            libsndfile1-dev \
            libsamplerate0-dev \
            liblz4-1
      - name: Install native host dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config opencv gflags nlohmann-json \
            libsndfile libsamplerate lz4
          # The LiteAvatar tests load liblz4 through ctypes discovery, which
          # does not search Homebrew on the python.org interpreter. Publish
          # the brew libdir as an ORDINARY variable: SIP strips DYLD_* when
          # the runner launches the protected /bin/bash of each step, so a
          # DYLD_* value stored here would not survive. Steps that launch
          # Python (the probe and the host run) export DYLD_LIBRARY_PATH
          # themselves, right before Python starts, from this variable.
          echo "LZ4_LIBDIR=$(brew --prefix lz4)/lib" >> "$GITHUB_ENV"
      - name: Probe native liblz4 (production loader path, fail fast)
        run: |
          if [ "$(uname)" = "Darwin" ] && [ -n "${LZ4_LIBDIR:-}" ]; then
            export DYLD_LIBRARY_PATH="${LZ4_LIBDIR}${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          fi
          python - <<'PY'
          import ctypes
          import ctypes.util
          import sys

          path = ctypes.util.find_library("lz4")
          if path is None:
              sys.exit(
                  "liblz4 is not discoverable via ctypes.util.find_library; "
                  "install it (Ubuntu: liblz4-1; macOS: brew lz4 with "
                  "DYLD_LIBRARY_PATH=\"$(brew --prefix lz4)/lib\" exported by "
                  "the launching shell) before the LiteAvatar background-cache "
                  "tests run"
              )
          lib = ctypes.CDLL(path)
          lib.LZ4_compressBound.argtypes = [ctypes.c_int]
          lib.LZ4_compressBound.restype = ctypes.c_int
          bound = lib.LZ4_compressBound(64)
          if bound <= 64:
              sys.exit(f"liblz4 at {path} has an unusable LZ4_compressBound: {bound}")
          print(f"liblz4 OK: {path} (LZ4_compressBound(64) = {bound})")
          PY
      - name: Install core Python host dependencies
        run: python -m pip install -r utils/tools/host_validation/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # utils/tools/catalog-publisher engines: >=22.12 <23
          node-version: "22.12"
      - name: Install catalog dependencies
        run: npm ci
        working-directory: utils/tools/catalog-publisher
      - name: Run host validation
        env:
          HOST_VALIDATION_OUTPUT: ${{ runner.temp }}/host-validation-report
        run: |
          # Re-export the brew liblz4 dir for this step's Python: SIP strips
          # DYLD_* from the protected step shell, so the value must be set
          # here, not inherited through GITHUB_ENV (see the macOS install
          # step). run.py and its worker subprocesses inherit it unchanged.
          if [ "$(uname)" = "Darwin" ] && [ -n "${LZ4_LIBDIR:-}" ]; then
            export DYLD_LIBRARY_PATH="${LZ4_LIBDIR}${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          fi
          python utils/tools/host_validation/run.py \
            --repo "$GITHUB_WORKSPACE" \
            --report "$HOST_VALIDATION_OUTPUT/report.json"
      - name: Upload host validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-validation-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/host-validation-report/report.json
            ${{ runner.temp }}/host-validation-report/host-validation-artifacts/
          if-no-files-found: warn
          retention-days: 30
