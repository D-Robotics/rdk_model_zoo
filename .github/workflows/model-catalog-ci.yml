name: Model catalog CI

on:
  pull_request:
    paths:
      - "site/**"
      - "release/models.yaml"
      - "release/benchmarks.yaml"
      - "release/schemas/**"
      - ".github/workflows/model-catalog-ci.yml"
      - ".github/workflows/model-catalog-pages.yml"
  push:
    paths:
      - "site/**"
      - "release/models.yaml"
      - "release/benchmarks.yaml"
      - "release/schemas/**"
      - ".github/workflows/model-catalog-ci.yml"
      - ".github/workflows/model-catalog-pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Validate catalog and build site
        run: npm run check
        working-directory: site
