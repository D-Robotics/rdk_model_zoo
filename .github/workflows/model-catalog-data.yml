name: Model catalog data

on:
  pull_request:
    paths:
      - "tools/catalog-publisher/**"
      - "platforms/**"
      - ".github/workflows/model-catalog-data.yml"
  push:
    branches: [main]
    paths:
      - "tools/catalog-publisher/**"
      - "platforms/**"
      - ".github/workflows/model-catalog-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate platform sources and catalog data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Benchmark records cite immutable commits as well as release tags, so
          # the full history has to be present for the source checks to resolve.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/catalog-publisher/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: tools/catalog-publisher
      - name: Validate sources, test, and build the catalog package
        run: npm run check
        working-directory: tools/catalog-publisher
      - name: Report the pinned catalog identity
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const meta = JSON.parse(readFileSync("tools/catalog-publisher/dist/catalog.meta.json", "utf8"));
            console.log(`catalog_version: ${meta.catalog_version}`);
            console.log(`payload: ${meta.payload} (${meta.bytes} bytes, sha256 ${meta.sha256})`);
            console.log(`platform tags: ${JSON.stringify(meta.platform_tags)}`);
          '
      - name: Upload catalog data package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: model-catalog-data
          path: |
            tools/catalog-publisher/dist/catalog.json
            tools/catalog-publisher/dist/catalog.meta.json
          if-no-files-found: error
          retention-days: 90
