name: sample-contract

# Static contract gate for the unified samples. Scope is the maintained
# sample list in utils/tools/sample_contract/sample-scope.md. The checker
# only reads source/docs and, in import mode, calls the trusted sample's
# side-effect-free build_parser. No downloads, no board SDK, no README
# code-block execution. The same gate covers develop/main pushes and pull
# requests; the complete host gate (this checker included) runs in
# host-validation.yml.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host-side parser import dependencies
        run: >
          python -m pip install
          -r utils/tools/host_validation/requirements.txt
      - name: Checker unit tests (fixtures first)
        run: python -m unittest discover -s utils/tools/sample_contract/tests -v
      - name: Check maintained sample scope
        # All maintained-sample README contracts are enforced without a debt
        # baseline. The report is written under $RUNNER_TEMP, never into the
        # checkout.
        env:
          CONTRACT_REPORT: ${{ runner.temp }}/sample-contract-report.json
        run: >
          python utils/tools/sample_contract/check.py
          --scope maintained
          --parser-mode import
          --report "$CONTRACT_REPORT"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-contract-report
          path: ${{ runner.temp }}/sample-contract-report.json
          if-no-files-found: warn
