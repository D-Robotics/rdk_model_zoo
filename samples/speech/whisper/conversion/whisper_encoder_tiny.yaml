model_parameters:
  onnx_model: '../model/whisper_encoder_tiny.onnx'
  march: "bayes-e"
  layer_out_dump: False
  working_dir: 'whisper_encoder_tiny_80x3000_x5'
  output_model_file_prefix: 'whisper_encoder_tiny_80x3000_x5'


input_parameters:
  input_name: "x"
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_rt: 'NHWC'
  input_layout_train: 'NHWC'
  input_shape: '1x80x3000x1'
  norm_type: 'no_preprocess'


calibration_parameters:
  cal_data_dir: '../cal_data'
  cal_data_type: 'float32'
  calibration_type: 'max'
  preprocess_on: False


compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O1'
