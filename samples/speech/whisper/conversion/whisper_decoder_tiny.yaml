# Notes:
#   The Whisper decoder has two inputs: "tokens" (int64) and "audio" (float32).
#   The decoder is NOT deployed to BPU because:
#     - int64 tokens are not well supported by BPU.
#     - The "audio" input depends on encoder output (chicken-and-egg problem for calibration).
#     - The autoregressive decoding loop is not suitable for static-graph BPU.
#   The decoder runs on CPU via ONNX Runtime instead.
#   This YAML is kept for reference only — use whisper_encoder_tiny.yaml for BPU compilation.


model_parameters:
  onnx_model: '../model/whisper_decoder_tiny.onnx'
  march: "bayes-e"
  layer_out_dump: False
  working_dir: 'whisper_decoder_tiny_12xN_nv12'
  output_model_file_prefix: 'whisper_decoder_tiny_12xN_nv12'


input_parameters:
  input_name: "tokens"
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_rt: 'NHWC'
  input_layout_train: 'BHWC'
  input_shape: ''
  norm_type: 'no_preprocess'


calibration_parameters:
  cal_data_dir: '../cal_data_decoder'
  cal_data_type: 'float32'
  calibration_type: 'default'
  preprocess_on: True


compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
