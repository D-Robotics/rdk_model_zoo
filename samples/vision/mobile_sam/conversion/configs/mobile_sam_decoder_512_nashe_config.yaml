model_parameters:
  onnx_model: './mobile_sam_decoder_512_op11.onnx'
  march: nash-e
  layer_out_dump: false
  working_dir: 'bpu_model_output_decoder_nashe'
  output_model_file_prefix: 'mobile_sam_decoder_512_nashe'
input_parameters:
  input_name: 'image_embeddings;boxes'
  input_type_rt: 'featuremap;featuremap'
  input_type_train: 'featuremap;featuremap'
  input_layout_train: 'NCHW;NCHW'
  input_layout_rt: 'NCHW;NCHW'
  input_shape: '1x256x32x32;1x4'
  norm_type: 'no_preprocess'
calibration_parameters:
  cal_data_dir: './decoder_calibration/image_embeddings;./decoder_calibration/boxes'
  cal_data_type: 'float32;float32'
  optimization: 'set_all_nodes_int16'
  calibration_type: 'max'
  max_percentile: 0.9999
compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O2'
  extra_params:
    input_no_padding: true
    output_no_padding: true
