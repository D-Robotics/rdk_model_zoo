model_parameters:
  onnx_model: './mobile_sam_decoder_512_box_op11.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: 'bpu_model_output_decoder_default'
  output_model_file_prefix: 'mobile_sam_decoder_512_box_default'

input_parameters:
  input_name: 'image_embeddings; boxes'
  input_type_rt: 'featuremap; featuremap'
  input_type_train: 'featuremap; featuremap'
  input_layout_train: 'NCHW; NCHW'
  input_layout_rt: 'NCHW; NCHW'
  input_shape: '1x256x32x32; 1x4'
  norm_type: 'no_preprocess; no_preprocess'

calibration_parameters:
  cal_data_dir: './decoder_calibration/calibration_embeddings; ./decoder_calibration/calibration_boxes'
  cal_data_type: 'float32; float32'
  calibration_type: 'default'

compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: false
  optimize_level: 'O3'
