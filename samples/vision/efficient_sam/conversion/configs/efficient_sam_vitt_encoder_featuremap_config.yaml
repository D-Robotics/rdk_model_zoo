model_parameters:
  onnx_model: './efficient_sam_vitt_encoder_512_splitqkv_op11.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: 'bpu_model_output_512_default_none'
  output_model_file_prefix: 'efficient_sam_vitt_encoder_512x512_default_none'

input_parameters:
  input_name: 'batched_images'
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_layout_rt: 'NCHW'
  input_shape: '1x3x512x512'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: './calibration_data_rgbchw_512'
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: false
  optimize_level: 'O3'