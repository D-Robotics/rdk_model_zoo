model_parameters:
  onnx_model: ./export/model.onnx
  march: nash-p
  working_dir: ./compiled/model
  output_model_file_prefix: yoloe_11s_seg_pf_nashp_640x640_nv12_float_20261103_o1_cpuptq
  layer_out_dump: false
input_parameters:
  input_name: images
  input_shape: 1x3x640x640
  input_type_rt: nv12
  input_type_train: rgb
  input_layout_train: NCHW
  scale_value: '0.00392156862745098'
  norm_type: data_scale
calibration_parameters:
  cal_data_dir: ./calibration/normalized
  cal_data_type: float32
  calibration_type: max
  max_percentile: 0.9999
  optimization: set_all_nodes_int16
compiler_parameters:
  jobs: 2
  compile_mode: latency
  core_num: 1
  debug: true
  optimize_level: O1
  extra_params:
    input_no_padding: true
    output_no_padding: true
