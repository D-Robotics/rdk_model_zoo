# MobileNetV1-100 PTQ configuration for RDK S100 / S100P / S600 (OE S v3.7.0,
# hb_compile). Compile parameters are those used for the published artifacts;
# only the placeholders differ (see README.md, "Compile"):
#   @TARGET@  s100, s100p or s600
#   @MARCH@   nash-e (S100), nash-m (S100P) or nash-p (S600)
#   @WORK@    the work directory of one model variant
#   @SIZE@    the model input size (224)
# The normalization is compiled into the model: mean = mean x 255,
# scale = 1 / (255 x std).
model_parameters:
  onnx_model: @WORK@/export/model.onnx
  march: @MARCH@
  working_dir: @WORK@/@TARGET@/build
  output_model_file_prefix: mobilenetv1_@TARGET@
  debug_mode: ''
  output_nodes: ''
  remove_node_name: ''
  remove_node_type: ''
input_parameters:
  input_name: data
  input_type_rt: nv12
  input_type_train: rgb
  input_layout_train: NCHW
  input_shape: 1x3x@SIZE@x@SIZE@
  norm_type: data_mean_and_scale
  mean_value: 127.5 127.5 127.5
  scale_value: 0.0078431372549 0.0078431372549 0.0078431372549
  std_value: ''
  separate_batch: false
  # OpenCV converts I420 to NV12 in limited (video) range, BT.601.
  input_space_and_range: bt601_video
calibration_parameters:
  cal_data_dir: @WORK@/@TARGET@/calibration/data
  cal_data_type: float32
  calibration_type: default
  # Variant 100: weight bias correction keeps the build INT8 and recovers its
  # Top-1 (see README.md, "Compile").
  quant_config:
    model_config:
      weight:
        bias_correction:
          num_sample: 1
          metric: cosine-similarity
compiler_parameters:
  optimize_level: O2
  compile_mode: latency
  core_num: 1
  jobs: 16
  advice: 0
  balance_factor: 0
  max_time_per_fc: 0
  cache_mode: disable
  cache_path: ''
