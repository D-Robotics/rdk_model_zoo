# X5 PP-OCRv3 recognition.  The model consumes the float32 RGB NCHW tensor
# prepared by the canonical Python pipeline; no host ImageNet normalization
# is applied, so calibration tensors are already in [0, 1].
model_parameters:
  onnx_model: './en_PP-OCRv3_rec_infer.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: 'model_output'
  output_model_file_prefix: 'en_PP-OCRv3_rec_infer-deploy_48x320_rgb'
  node_info:
    'p2o.Softmax.0':
      ON: 'BPU'
      InputType: 'int16'
      OutputType: 'int16'
    'p2o.Softmax.1':
      ON: 'BPU'
      InputType: 'int16'
      OutputType: 'int16'
    'p2o.Softmax.2':
      ON: 'BPU'
      InputType: 'int16'
      OutputType: 'int16'

input_parameters:
  input_name: ''
  input_type_rt: 'featuremap'
  input_layout_rt: 'NCHW'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_shape: ''
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: './calibration_data_rgb_f32'
  cal_data_type: 'float32'
  calibration_type: 'default'
  optimization: 'set_all_nodes_int16'

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
