model_parameters:
  onnx_model: ./export/pp_liteseg_stdc1_cityscapes_1024x512_logits.onnx
  march: nash-e
  output_model_file_prefix: pp_liteseg_stdc1_cityscapes_nashe_1024x512_featuremap_int16_cpuptq_20261104_20261103_o1
  working_dir: ./compiled/model
input_parameters:
  input_name: x
  input_type_rt: featuremap
  input_type_train: featuremap
  input_layout_train: NCHW
  input_layout_rt: NCHW
  input_shape: 1x3x512x1024
  norm_type: no_preprocess
calibration_parameters:
  cal_data_dir: ./calibration/normalized
  cal_data_type: float32
  calibration_type: max
  max_percentile: 0.9999
  optimization: set_all_nodes_int16
compiler_parameters:
  compile_mode: latency
  core_num: 1
  extra_params:
    input_no_padding: true
    output_no_padding: true
  optimize_level: O1
  jobs: 2
  debug: true
