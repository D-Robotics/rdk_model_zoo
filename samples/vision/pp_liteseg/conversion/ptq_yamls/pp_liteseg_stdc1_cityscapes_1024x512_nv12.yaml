model_parameters:
  onnx_model: '../onnx/pp_liteseg_stdc1_cityscapes_1024x512_sim.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: 'pp_liteseg_stdc1_cityscapes_1024x512_nv12_output'
  output_model_file_prefix: 'pp_liteseg_stdc1_cityscapes_1024x512_nv12'

input_parameters:
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_mean_and_scale'
  mean_value: 123.675 116.28 103.53
  scale_value: 0.017124753831663668 0.01750700280112045 0.017429193899782137

calibration_parameters:
  cal_data_dir: '../calibration_data_rgb_f32_1024x512'
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  jobs: 16
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'

