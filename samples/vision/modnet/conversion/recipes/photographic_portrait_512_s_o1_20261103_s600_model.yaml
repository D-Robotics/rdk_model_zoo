model_parameters:
  onnx_model: ./export/modnet_photographic_portrait_512x512_rgb_bayese_20261102.onnx
  march: nash-p
  layer_out_dump: false
  working_dir: ./compiled/model
  output_model_file_prefix: modnet_photographic_portrait_512x512_rgb_nashp_20261103_o1
input_parameters:
  input_name: input
  input_type_rt: featuremap
  input_type_train: featuremap
  input_layout_train: NCHW
  input_layout_rt: NCHW
  input_shape: 1x3x512x512
  norm_type: no_preprocess
calibration_parameters:
  cal_data_dir: ./calibration/calibration
  cal_data_type: float32
  calibration_type: max
  max_percentile: 0.9999
compiler_parameters:
  compile_mode: latency
  core_num: 1
  debug: true
  optimize_level: O1
  jobs: 2
  extra_params:
    input_no_padding: true
    output_no_padding: true
