# YOLO26 Depth lite: raw-logit ONNX + featuremap float32 NCHW input.
model_parameters:
  onnx_model: './onnx/yolo26l-depth_op11_lite.onnx'
  march: 'nash-m'
  layer_out_dump: false
  working_dir: 'bpu_model_output_yolo26l_lite_nashm'
  output_model_file_prefix: 'yolo26l_depth_lite_nashm_768x768'
input_parameters:
  input_name: 'images'
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_shape: '1x3x768x768'
calibration_parameters:
  cal_data_dir: './calibration'
  cal_data_type: 'float32'
  calibration_type: 'default'
compiler_parameters:
  jobs: 16
  compile_mode: 'latency'
  debug: false
  optimize_level: 'O2'
