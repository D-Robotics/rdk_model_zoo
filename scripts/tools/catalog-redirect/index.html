<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>RDK Model Zoo catalog has moved</title>
    <link rel="canonical" href="https://d-robotics.github.io/model_zoo_doc/models/" />
    <script>
      /*
       * The dashboard used to be served from /rdk_model_zoo/ as a single-page
       * app, so every deep link it ever published is a query string on that one
       * path. The dashboard now lives inside the documentation site, and the
       * query vocabulary is unchanged, so forwarding the query and fragment
       * verbatim keeps every shared link working.
       *
       * LOCAL ARTIFACT. No workflow in this repository deploys it; see
       * README.md before publishing anything.
       */
      (function () {
        "use strict";
        var TARGET = "https://d-robotics.github.io/model_zoo_doc/models/";
        var destination = TARGET + window.location.search + window.location.hash;
        var link = document.getElementById("destination");
        link.setAttribute("href", destination);
        link.textContent = destination;
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <h1>RDK Model Zoo catalog has moved</h1>
    <p>
      The interactive model catalog and benchmark view are now part of the documentation site.
      You should be redirected automatically; if not, continue to
      <a id="destination" href="https://d-robotics.github.io/model_zoo_doc/models/"
        >https://d-robotics.github.io/model_zoo_doc/models/</a
      >.
    </p>
    <noscript>
      <p>Automatic redirection needs JavaScript. Follow the link above to reach the catalog.</p>
    </noscript>
  </body>
</html>
