id: paraformer/paraformer/asr
name: Paraformer
domain: speech
source: paraformer
family: paraformer
task: asr
description:
  zh: Paraformer 把 16 kHz 语音转成文本，流水线包含前端、编码器、预测器、CPU 上的连续积分发放和译码器，对应多段分开部署的模型。
  en: Paraformer converts 16 kHz speech into text using a FunASR frontend, an encoder, a predictor, CPU continuous integrate-and-fire (CIF), and a decoder. The deployment uses three separately published S100 HBM files and an ordered 8,404-token vocabulary. CPU CIF is explicit between predictor and decoder; text decoding preserves repeated tokens and removes source special/BPE markers. There is no VAD, streaming, punctuation restoration, timestamp output or custom hotword support in this sample.
