name: Wav2Vec2 ASR
domain: speech
source: asr
family: asr
task: asr
description:
  zh: 本样例使用已发布的 S 系列 Wav2Vec2 ASR 模型和固定 3503-token 词表转写音频。WAV/FLAC 按有限大小分块读取，声道平均为单声道，重采样到 16 kHz，再逐块归一化，每次推理输入 30000 点（1.875 秒）。处理完整文件，包括最后补零块；每个窗口独立处理并重置解码状态，运行时不跨窗口保留声学状态或执行重叠拼接。
  en: This sample transcribes audio using the published S-series Wav2Vec2 ASR model and a fixed 3503-token vocabulary. It reads WAV/FLAC in bounded chunks, mixes channels to mono, resamples to 16 kHz, normalizes each chunk and submits 30000 samples per inference (1.875 seconds). It handles the whole file, including the final padded chunk. Each chunk is processed independently with fresh decoder state; the runtime does not carry acoustic state or overlap adjacent windows.
