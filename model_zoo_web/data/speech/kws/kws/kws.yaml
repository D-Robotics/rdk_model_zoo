id: kws/kws/kws
name: MDTC KWS
domain: speech
source: kws
family: kws
task: kws
description:
  zh: 本样例使用已发布的 MDTC 唤醒词模型处理单声道 16 kHz 音频，返回片段内模型概率的最大值，以及按阈值判断是否出现“hey snips”的结果；它不转写语音或检测任意关键词。只使用前 60000 个采样点，短音频补零；16 kHz 下为 3.75 秒。长录音需由调用者明确分窗。
  en: This sample runs the published MDTC wake-word model on mono 16 kHz audio. It returns the maximum model probability over the supplied clip and an optional threshold decision for “hey snips”; it does not transcribe speech or detect arbitrary keywords. Only the first 60000 samples are used; shorter clips are zero-padded. At 16 kHz this is 3.75 seconds. Longer recordings require explicitly selected windows.
