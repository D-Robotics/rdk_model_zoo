description:
  zh: RepVGG 是一种 VGG 风格的卷积神经网络家族，核心思想是结构重参数化。训练阶段可以使用多分支结构，部署阶段转换为由 3x3 卷积和 ReLU 组成的直连结构，以提升推理效率。
  en: RepVGG is a VGG-style convolutional network family that uses structural re-parameterization.
    During training it can use multi-branch structures, while during deployment it
    is converted into a plain stack of 3x3 convolution and ReLU layers for efficient
    inference.
