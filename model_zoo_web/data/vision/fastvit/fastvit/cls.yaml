task: cls
description:
  zh: FastViT 是使用结构重参数化构建高效 token 混合模块的混合视觉 Transformer 系列：训练期模块保留跳连与额外分支，推理期再把它们折叠成普通卷积，降低访存开销。家族内 token 混合器并不一致：按上游模型定义， 已发布的 t8/t12/s12 四个 stage 全部使用 RepMixer token 混合，只有 sa12 在 stage 1–3 保持 RepMixer、仅 stage 4 使用自注意力（并带 RepCPE 位置编码）——卷积/注意力混合设计即指此类配置。 ImageNet-1k 1000 类分类精度保持竞争力。
  en: 'FastViT is a hybrid vision transformer family that uses structural reparameterization to build efficient token-mixing blocks: training-time blocks keep their skip connections and extra branches, which are then folded into plain convolutions for inference, cutting memory access overhead. The token mixers differ across the family: in the upstream model definitions, the published t8/t12/s12 variants use RepMixer token mixing in all four stages, while sa12 keeps RepMixer in stages 1–3 and uses self-attention (with a RepCPE positional encoding) only in stage 4 — a conv/attention hybrid configuration. ImageNet-1k 1000-class classification accuracy stays competitive.'
