task: cls
description:
  zh: RepViT 从轻量级 ViT 的角度重新审视移动端 CNN 设计。该模型保持纯 CNN 的部署结构，同时借鉴轻量级 ViT 的设计思路，并通过结构重参数化提升部署推理效率。
  en: RepViT revisits lightweight mobile CNN design from a ViT perspective. It keeps a pure CNN deployment structure while borrowing lightweight ViT design ideas, and improves inference efficiency through structural reparameterization.
