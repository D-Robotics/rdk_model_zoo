description:
  zh: EdgeNeXt 是面向移动视觉的高效 CNN-Transformer 混合架构：四级金字塔把卷积编码器与 SDTA（Split Depth-wise Transpose Attention）编码器组合在一起，在分类精度、模型体积与推理速度之间取得平衡，面向 ImageNet-1k 1000 类分类。
  en: 'EdgeNeXt is an efficient hybrid CNN-Transformer architecture for mobile vision: a four-stage pyramid combines convolutional encoders with SDTA (Split Depth-wise Transpose Attention) encoders to balance classification accuracy, model size, and inference speed. It targets ImageNet-1k 1000-class classification.'
