description:
  zh: YOLOv5 是单阶段 anchor 检测器：CSPDarknet backbone 加 FPN+PAN 特征融合，三个特征尺度（stride 8/16/32）的检测头输出 COCO 风格的框、置信度和类别。n/s/m/l/x 规格在速度与精度间取舍。源工程为 ultralytics/yolov5；本示例保留 X5 与 S 两套不同的输入协议。
  en: The n/s/m/l/x scale variants trade speed against accuracy. The source resource is ultralytics/yolov5. X5 and S models use different input tensors and output quantization metadata.
