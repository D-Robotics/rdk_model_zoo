task: detect
description:
  zh: YOLOv8 Detect 采用无锚框解耦检测头和 DFL 边框分布回归，在多尺度特征图上预测类别与边框，经解码、置信度筛选和 NMS 输出目标框。
  en: YOLOv8 Detect uses an anchor-free decoupled head with DFL box-distribution regression across multiple
    feature scales, then decodes and filters detections with NMS.
