description:
  zh: UNet 使用带跳跃连接的编码器与解码器，结合高层语义与精细空间信息。本示例采用 ResNet 主干，在 RDK X5 上进行 Pascal VOC 21 类语义分割，提供五种主干的模型、转换配方与 Python 推理。
  en: UNet uses an encoder-decoder with skip connections to combine semantic features and fine spatial detail. This sample uses ResNet backbones for 21-class Pascal VOC segmentation on RDK X5, with five model variants, conversion recipes and Python inference.
