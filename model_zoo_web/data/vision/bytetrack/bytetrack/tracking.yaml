missing:
- field: mot-accuracy
  status: missing
  title:
    zh: 跟踪精度
    en: Tracking accuracy
  note:
    zh: MOTA / IDF1 / HOTA 待 MOT 数据集评测。
    en: MOTA / IDF1 / HOTA evaluation on a MOT dataset is pending.
- field: runtime-latency-1-and-2-threads
  status: missing
  title:
    zh: 单路与双路性能
    en: Single- and dual-stream performance
  note:
    zh: 检测模型与 CPU 跟踪的 1 路 / 2 路并发延迟待按正式口径测量。
    en: Single- and two-thread latency for the detector and the CPU tracker is pending under the formal benchmark protocol.
- field: cpp-end-to-end-pipelines
  status: missing
  title:
    zh: C++ 端到端性能
    en: C++ end-to-end performance
  note:
    zh: C++ 1 路 / 2 路端到端流水线数据待测量。
