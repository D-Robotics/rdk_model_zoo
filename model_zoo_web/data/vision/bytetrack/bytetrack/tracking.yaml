schema_version: 1
profile: sample
id: bytetrack/bytetrack/tracking
name: ByteTrack
domain: vision
source: bytetrack
provider: ifzhang/ByteTrack
family: bytetrack
task: tracking
task_ids:
- multi-object-tracking
description:
  zh: BYTE 式多目标跟踪。YOLOv5 检测器在 BPU 上输出检测框，高低分两阶段数据关联（卡尔曼预测 + IoU 匹配 + 匈牙利指派）在 CPU 上运行，输出逐帧稳定 track id。
  en: BYTE-style multi-object tracking. A YOLOv5 detector produces boxes on the BPU while two-stage low/high-score association (Kalman prediction, IoU matching, Hungarian assignment) runs on the CPU and emits stable per-frame track ids.
license:
  name: MIT
  url: https://github.com/ifzhang/ByteTrack/blob/main/LICENSE
sample_path: samples/vision/bytetrack
sample_commit: c8eb9d56264fbaf8f78265139d053e027bd32b28
pipeline: detector_cpu_tracker
pipeline_note:
  zh: 检测器 + CPU 关联。YOLOv5 检测模型在 BPU 运行（X5 使用已发布 640×640 BIN，S100/S600 使用已发布 672×672 HBM），BYTE 跟踪逻辑全部在 CPU 运行。
  en: Detector plus CPU association. The YOLOv5 model runs on the BPU (the published 640x640 BIN on X5, the published 672x672 HBM on S100/S600) while all BYTE tracking logic runs on the CPU.
variants:
- size: default
  input_contract:
  - label:
      zh: 检测输入
      en: Detector input
    value:
      zh: NV12（X5 640 × 640 / S100 · S100P · S600 672 × 672）
      en: NV12 (X5 640x640, S100/S100P/S600 672x672)
  - label:
      zh: 跟踪输入
      en: Tracker input
    value:
      zh: 每帧检测框（x1, y1, x2, y2, score）与图像尺寸
      en: Per-frame detection boxes (x1, y1, x2, y2, score) plus the image size
  - label:
      zh: 输出
      en: Output
    value:
      zh: 逐帧 track id + 检测框 + 置信度
      en: Per-frame track ids with boxes and confidences
  platforms:
  - platform: x5
    status: available
    runtimes:
    - python
    - cpp
    model_availability:
      status: published-download
      note:
        zh: 默认检测器为 YOLOv5 目录已发布的 yolov5n v7.0 640×640 BIN，s/m/l/x 变体同目录发布；SHA-256 为板端实测值。
        en: The default detector is the yolov5n v7.0 640x640 BIN published in the YOLOv5 catalog, with s/m/l/x variants alongside; the SHA-256 is the value observed on board.
    artifacts:
    - role: detector
      filename: yolov5n_tag_v7.0_detect_640x640_bayese_nv12.bin
      format: bin
      url: https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_x5/yolov5n_tag_v7.0_detect_640x640_bayese_nv12.bin
      sha256: c6447df0909520ada1f955a51d0f68ee6bc229fe8c7f5144a0646693bd8a3941
      sha256_provenance: observed-on-board
      size_bytes: 2430384
    verification:
      zh: X5 8GB 板端：同一检测输入回放，C++ 与 Python 输出的 track id、行数与行序完全一致，坐标数值差最大 6.8e-13；C++ 同输入跟踪 0.04–1.9 ms/帧（5–100 目标）。整段视频端到端 329 帧 3124 行（C++，letterbox 前处理）；回放口径 329 帧 1948 行与基线一致。
      en: On an X5 8GB board, replaying identical detections, the C++ and Python trackers emit identical track ids, row counts and row order with a maximum coordinate difference of 6.8e-13, and C++ same-input tracking costs 0.04-1.9 ms/frame for 5-100 objects. The whole-video end-to-end run covers 329 frames and 3124 rows (C++, letterbox preprocessing); the replay protocol yields 329 frames and 1948 rows matching the baseline.
    evidence:
    - label:
        zh: 板端一致性与性能证据摘要
        en: Board parity and performance evidence summary
      url: sample-evidence/bytetrack-x5.json
    - label:
        zh: C++ 构建日志节选（板端编译，非模型转换）
        en: C++ build log excerpts (on-board compile, not model conversion)
      url: sample-evidence/bytetrack-x5-build-excerpt.log
    quickstart:
    - title:
        zh: 下载默认检测器（X5）
        en: Download the default detector (X5)
      command: python3 -m samples.vision.bytetrack.model.download --target x5 --variant n-v7.0
    - title:
        zh: 下载示例视频
        en: Download the sample video
      command: curl -fL 'https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s100/ByteTrack/track_test.mp4' -o samples/vision/bytetrack/test_data/track_test.mp4
    - title:
        zh: 视频跟踪（X5）
        en: Track the video (X5)
      command: python3 -m samples.vision.bytetrack.runtime.python.main --target x5 --variant n-v7.0 --input samples/vision/bytetrack/test_data/track_test.mp4 --output samples/vision/bytetrack/test_data/result_x5.mp4 --records samples/vision/bytetrack/test_data/result_x5.jsonl
  - platform: s100
    status: available
    runtimes:
    - python
    - cpp
    model_availability:
      status: published-download
      note:
        zh: 使用 YOLOv5 目录已发布的 yolov5x 672×672 HBM；发布清单未提供该文件的 SHA-256，下载器会打印本地值供核对。
        en: Uses the yolov5x 672x672 HBM published in the YOLOv5 catalog; the release manifest provides no SHA-256 for this file, and the downloader prints the local digest for checking.
    artifacts:
    - role: detector
      filename: s100/yolov5x_672x672_nv12.hbm
      format: hbm
      url: https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s100/ultralytics_YOLO/yolov5x_672x672_nv12.hbm
      sha256_provenance: not-provided
    verification:
      zh: S100 板端：视频链路 10 帧 40 行通过，使用板端镜像自带的 yolov5x 672×672 模型。
      en: On an S100 board the 10-frame video path emits 40 track rows, using the yolov5x 672x672 model bundled with the board image.
    evidence:
    - label:
        zh: 板端一致性与性能证据摘要
        en: Board parity and performance evidence summary
      url: sample-evidence/bytetrack-s100.json
    - label:
        zh: C++ 构建日志节选（板端编译，非模型转换）
        en: C++ build log excerpts (on-board compile, not model conversion)
      url: sample-evidence/bytetrack-s100-build-excerpt.log
    quickstart:
    - title:
        zh: 下载检测模型（S100）
        en: Download the detector (S100)
      command: python3 -m samples.vision.bytetrack.model.download --target s100 --output-dir samples/vision/bytetrack/model
    - title:
        zh: 下载示例视频
        en: Download the sample video
      command: curl -fL 'https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s100/ByteTrack/track_test.mp4' -o samples/vision/bytetrack/test_data/track_test.mp4
    - title:
        zh: 视频跟踪（S100）
        en: Track the video (S100)
      command: python3 -m samples.vision.bytetrack.runtime.python.main --target s100 --asset-id s:bytetrack:s100/yolov5x_672x672_nv12.hbm --model-path samples/vision/bytetrack/model/s100/yolov5x_672x672_nv12.hbm --input samples/vision/bytetrack/test_data/track_test.mp4 --output samples/vision/bytetrack/test_data/result_unified.mp4 --records samples/vision/bytetrack/test_data/result_unified.jsonl
  - platform: s100p
    status: available
    runtimes:
    - python
    - cpp
    model_availability:
      status: manual-compile
      note:
        zh: S100P 未发布检测模型：按转换指南编译 nash-m 672×672 YOLOv5x HBM，经 --model-path 使用。
        en: No S100P detector is published; compile a nash-m 672x672 YOLOv5x HBM following the conversion guide and pass it via --model-path.
      guide_url: https://github.com/D-Robotics/rdk_model_zoo/tree/c8eb9d56264fbaf8f78265139d053e027bd32b28/samples/vision/bytetrack/conversion
    verification:
      zh: S100P 板端：检测回放 329 帧 1948 行，输出 SHA-256 与 X5 回放一致；视频链路 10 帧 40 行使用板端镜像 s100 家族模型，输出与 S100 相同。
      en: On an S100P board the detector replay covers 329 frames and 1948 rows with an output SHA-256 identical to the X5 replay; the 10-frame video path uses the board image's s100-family model and matches the S100 output.
    evidence:
    - label:
        zh: 板端一致性与性能证据摘要
        en: Board parity and performance evidence summary
      url: sample-evidence/bytetrack-s100p.json
    - label:
        zh: C++ 构建日志节选（板端编译，非模型转换）
        en: C++ build log excerpts (on-board compile, not model conversion)
      url: sample-evidence/bytetrack-s100p-build-excerpt.log
    quickstart:
    - title:
        zh: 确认已按转换指南准备 S100P 检测模型
        en: Confirm the S100P detector is prepared per the conversion guide
      command: test -f samples/vision/bytetrack/model/s100p/yolov5x_672x672_nv12.hbm
    - title:
        zh: 下载示例视频
        en: Download the sample video
      command: curl -fL 'https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s100/ByteTrack/track_test.mp4' -o samples/vision/bytetrack/test_data/track_test.mp4
    - title:
        zh: 视频跟踪（S100P）
        en: Track the video (S100P)
      command: python3 -m samples.vision.bytetrack.runtime.python.main --target s100p --asset-id s:bytetrack:s100p/yolov5x_672x672_nv12.hbm --model-path samples/vision/bytetrack/model/s100p/yolov5x_672x672_nv12.hbm --input samples/vision/bytetrack/test_data/track_test.mp4 --output samples/vision/bytetrack/test_data/result_unified.mp4 --records samples/vision/bytetrack/test_data/result_unified.jsonl
  - platform: s600
    status: available
    runtimes:
    - python
    - cpp
    model_availability:
      status: published-download
      note:
        zh: 使用 YOLOv5 目录已发布的 yolov5x 672×672 HBM；发布清单未提供该文件的 SHA-256，下载器会打印本地值供核对。
        en: Uses the yolov5x 672x672 HBM published in the YOLOv5 catalog; the release manifest provides no SHA-256 for this file, and the downloader prints the local digest for checking.
    artifacts:
    - role: detector
      filename: s600/yolov5x_672x672_nv12.hbm
      format: hbm
      url: https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s600/ultralytics_YOLO/yolov5x_672x672_nv12.hbm
      sha256_provenance: not-provided
    verification:
      zh: S600 64GB 板端：视频链路 10 帧 40 行通过，使用板端镜像自带的 yolov5x 672×672 模型。
      en: On an S600 64GB board the 10-frame video path emits 40 track rows, using the yolov5x 672x672 model bundled with the board image.
    evidence:
    - label:
        zh: 板端一致性与性能证据摘要
        en: Board parity and performance evidence summary
      url: sample-evidence/bytetrack-s600.json
    - label:
        zh: C++ 构建日志节选（板端编译，非模型转换）
        en: C++ build log excerpts (on-board compile, not model conversion)
      url: sample-evidence/bytetrack-s600-build-excerpt.log
    quickstart:
    - title:
        zh: 下载检测模型（S600）
        en: Download the detector (S600)
      command: python3 -m samples.vision.bytetrack.model.download --target s600 --output-dir samples/vision/bytetrack/model
    - title:
        zh: 下载示例视频
        en: Download the sample video
      command: curl -fL 'https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s100/ByteTrack/track_test.mp4' -o samples/vision/bytetrack/test_data/track_test.mp4
    - title:
        zh: 视频跟踪（S600）
        en: Track the video (S600)
      command: python3 -m samples.vision.bytetrack.runtime.python.main --target s600 --asset-id s:bytetrack:s600/yolov5x_672x672_nv12.hbm --model-path samples/vision/bytetrack/model/s600/yolov5x_672x672_nv12.hbm --input samples/vision/bytetrack/test_data/track_test.mp4 --output samples/vision/bytetrack/test_data/result_unified.mp4 --records samples/vision/bytetrack/test_data/result_unified.jsonl
