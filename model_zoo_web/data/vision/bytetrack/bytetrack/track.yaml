description:
  zh: ByteTrack 通过关联高置信度和低置信度检测框，在视频帧之间跟踪目标。恢复低分检测有助于在行人被遮挡时保持身份连续。本示例组合 YOLOv5 行人检测器与 CPU BYTETracker。
  en: ByteTrack tracks objects across video frames by associating both high- and low-confidence detections. Recovering low-score detections helps maintain identities when pedestrians are partly occluded. This sample combines a YOLOv5 person detector with the CPU BYTETracker.
