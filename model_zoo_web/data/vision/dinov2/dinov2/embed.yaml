description:
  zh: DINOv2 是用于图像表示的自监督视觉 Transformer。ViT-S/14 主干生成全局嵌入与稠密 patch 特征，可供下游视觉任务使用。本示例在 RDK S100、S100P 和 S600 上部署 int16 PTQ 模型。
  en: DINOv2 is a self-supervised vision transformer for image representations. The ViT-S/14 backbone produces a global embedding and dense patch features for downstream visual tasks. This sample deploys its int16 PTQ model on RDK S100, S100P and S600.
