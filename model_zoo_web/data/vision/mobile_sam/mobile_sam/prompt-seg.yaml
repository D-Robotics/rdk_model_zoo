description:
  zh: MobileSAM 使用 TinyViT 替换 SAM 的图像编码器，降低提示式分割的计算成本。本示例使用一个框提示，从解码器候选结果中选择分割掩码。
  en: MobileSAM replaces SAM’s image encoder with TinyViT to reduce the cost of prompt-based
    segmentation. This sample uses one box prompt to select a mask from the decoder’s
    candidates.
