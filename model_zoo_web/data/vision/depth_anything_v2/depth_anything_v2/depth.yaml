  zh: Depth Anything V2 从单张图像估计稠密相对深度，用教师模型和伪标签提升细节。
  en: Depth Anything V2 estimates dense relative depth from a single image. It uses synthetic labeled images, a larger teacher and pseudo-labeled real images to improve fine detail. This sample provides inference and depth visualization on RDK S100.
