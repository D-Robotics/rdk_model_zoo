quickstart:
- title:
    zh: 获取固定的上游源码
    en: Fetch the pinned upstream source
  command: python3 samples/vision/hobot_mot/model/download.py
- title:
    zh: 构建原生跟踪库
    en: Build the native tracker library
  command: cmake -B samples/vision/hobot_mot/runtime/cpp/build -S samples/vision/hobot_mot/runtime/cpp && cmake --build samples/vision/hobot_mot/runtime/cpp/build
- title:
    zh: 回放 72 帧示例序列（Python）
    en: Replay the 72-frame sample sequence (Python)
  command: ./samples/vision/hobot_mot/runtime/python/run.sh
