description:
  zh: ConvNeXt 是从原始 ResNet 出发、逐步借鉴 Swin Transformer 设计改造而来的纯卷积网络（"A ConvNet for the
    2020s"）。它面向 ImageNet-1k 1000 类图像分类，输出 Top-K 类别及置信度。
  en: ConvNeXt is a pure convolutional network modernized from the original ResNet
    by progressively adopting designs borrowed from the Swin Transformer ("A ConvNet
    for the 2020s"). It targets ImageNet-1k 1000-class image classification and outputs
    Top-K classes with confidence scores.
