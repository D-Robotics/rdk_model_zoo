task: cls
description:
  zh: 本样例为全部受支持目标提供同一个 Python 运行时。 EfficientNetClassifier 类执行由 predict 串联的 preprocess → infer → postprocess 流程：按检测到的板卡从平台发布 Manifest 解析唯一的制品引用，核验板卡身份，懒加载 hbm_runtime， 返回带类型的 Top-K 结果（见 runtime/python/README_cn.md）。
  en: 'A single Python runtime serves all supported targets. The EfficientNetClassifier class runs a preprocess → infer → postprocess flow chained by predict: it resolves one exact artifact reference from the platform release manifest for the detected board, verifies the board identity, loads hbm_runtime lazily, and returns a typed Top-K result (runtime/python/README.md).'
