id: diffusiondrive/diffusiondrive/drive
name: DiffusionDrive
domain: vision
source: diffusiondrive
family: diffusiondrive
task: drive
description:
  zh: DiffusionDrive 根据相机、LiDAR 和自车状态特征规划未来轨迹。截断扩散解码器预测八个未来位姿，并提供 Agent 状态和 BEV 语义辅助输出。本示例在 RDK S100P 和 S600 上运行已准备的 NAVSIM 特征。
  en: DiffusionDrive plans future vehicle trajectories from camera, LiDAR and ego-state features. Its truncated diffusion decoder predicts eight future poses, with auxiliary agent-state and BEV semantic heads. This sample runs prepared NAVSIM features on RDK S100P and S600.
