description:
  zh: R3D-18 用于短视频片段的动作识别。它把 ResNet-18 的卷积扩展为三维卷积，同时学习空间与时间特征，预测 Kinetics 的 400 个动作类别。
  en: R3D-18 recognizes actions in short video clips. It extends ResNet-18 with 3D convolutions to learn spatial and temporal features together, and predicts the 400 Kinetics action classes.
