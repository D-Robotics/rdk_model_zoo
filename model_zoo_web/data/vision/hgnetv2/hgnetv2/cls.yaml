description:
  zh: HGNetV2 是用于视觉任务的卷积骨干网络；本 sample 提供 b0–b4 的 ImageNet-1k 分类入口。它是面向精度/延迟平衡设计的下一代
    CNN 骨干， 是原 HGNet 的后继，在分类、检测与分割任务中均有良好表现。
  en: HGNetV2 is a convolutional backbone for vision tasks; this sample exposes b0–b4
    ImageNet-1k classification models. HGNetV2 is a next-generation CNN backbone designed
    for a strong accuracy/latency balance, succeeding the original HGNet, and performing
    well in classification, detection and segmentation.
