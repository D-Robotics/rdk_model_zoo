schema_version: 1
registration: pending
id: paddle_ocr/paddle_ocr/ocr-det
name: PaddleOCR Detection
domain: vision
source: paddle_ocr
family: paddle_ocr
task: ocr-det
description:
  zh: PaddleOCR 用于图片文字检测与识别。DB 检测器定位文字区域，再由 CRNN 识别器对裁剪区域进行 CTC 解码。本示例提供 X5 的 PP-OCRv3 英文模型对与 S100 的 PP-OCRv6 模型对。
  en: PaddleOCR detects and recognizes text in images. A DB detector locates text regions, then a CRNN recognizer decodes each crop with CTC. This sample provides the PP-OCRv3 English pair for X5 and the PP-OCRv6 pair for S100.
sample_path: samples/vision/paddle_ocr
sample_revision: 7a97c1780b0cfa131ff0007d662e255e5e41c12e
license:
  name: Apache-2.0
  url: https://www.apache.org/licenses/LICENSE-2.0
  scope: sample-code
  source: samples/vision/paddle_ocr/conversion/s100/paddleocr_det_configs.yaml
upstream:
- kind: repository
  name: PaddlePaddle/PaddleOCR.git
  url: https://github.com/PaddlePaddle/PaddleOCR.git
  source: samples/vision/paddle_ocr/conversion/README.md
supported_platforms:
- platform: x5
  evidence: docs/release/x5/models.yaml
- platform: s100
  evidence: docs/release/s/models.yaml
published_variants:
- name: S100
  source: samples/vision/paddle_ocr/README.md
- name: S600
  source: samples/vision/paddle_ocr/README.md
manifest_tasks:
- ocr-text-detection
- text-detection
conversion_configs:
- path: samples/vision/paddle_ocr/conversion/s100/paddleocr_det_configs.yaml
  march: nash-e
  runtime_input: nv12
  train_input: rgb
  train_layout: NCHW
  resolution: 640x640
- path: samples/vision/paddle_ocr/conversion/x5/ptq_yamls/paddleocr_det_config.yaml
  march: bayes-e
  runtime_input: nv12
  train_input: rgb
  train_layout: NCHW
  resolution: 640x640
usage:
- source: samples/vision/paddle_ocr/README.md
  lines:
  - python3 samples/vision/paddle_ocr/runtime/python/main.py
  - --list-models --target auto
  - python3 samples/vision/paddle_ocr/runtime/python/main.py --prepare
  - --target x5
  - --det-asset-id x5:paddleocr:en_PP-OCRv3_det_640x640_nv12.bin
  - --rec-asset-id x5:paddleocr:en_PP-OCRv3_rec_48x320_rgb.bin
  - --model-dir /tmp/rdk-models
  - --det-model-path /tmp/rdk-models/en_PP-OCRv3_det_640x640_nv12.bin
  - --rec-model-path /tmp/rdk-models/en_PP-OCRv3_rec_48x320_rgb.bin
  - --test-img samples/vision/paddle_ocr/test_data/x5/paddleocr_test.jpg
  - --output-format json
  - --target s100
documented_downloads:
- platform: x5
  filename: en_PP-OCRv3_det_640x640_nv12.bin
  url: https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_x5/en_PP-OCRv3_det_640x640_nv12.bin
  source: docs/release/x5/models.yaml
  format: bin
- platform: s100
  filename: s100/PP-OCRv6_det_infer-deploy_640x640_nv12.hbm
  url: https://archive.d-robotics.cc/downloads/rdk_model_zoo/rdk_s100/paddle_ocr/PP-OCRv6_det_infer-deploy_640x640_nv12.hbm
  source: docs/release/s/models.yaml
  format: hbm
example_image:
  path: samples/vision/paddle_ocr/test_data/x5/paddleocr_test.jpg
  source: samples/vision/paddle_ocr/test_data/x5/paddleocr_test.jpg
