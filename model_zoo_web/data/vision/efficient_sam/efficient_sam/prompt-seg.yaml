description:
  zh: EfficientSAM 使用轻量图像编码器完成提示式分割。本示例部署 ViT-Tiny 编码器与掩码解码器，解码器的两个正点提示固定在模型中。
  en: EfficientSAM uses a lightweight image encoder to perform prompt-based segmentation.
    This sample deploys the ViT-Tiny encoder with a mask decoder whose two positive
    point prompts are fixed in the model.
