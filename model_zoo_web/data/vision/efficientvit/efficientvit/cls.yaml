description:
  zh: EfficientViT 是采用高效注意力模块的图像分类网络。它用级联组注意力降低标准自注意力的访存开销，并使用批归一化以便推理侧融合。
  en: EfficientViT is an image classifier with efficient attention blocks. It uses
    cascaded group attention to reduce the memory-bound cost of standard self-attention,
    and batch normalization for inference-friendly fusion.
