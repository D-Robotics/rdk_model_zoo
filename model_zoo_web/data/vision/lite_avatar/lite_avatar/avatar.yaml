missing:
- field: warmed-render-benchmark
  status: missing
  title:
    zh: 正式渲染基准
    en: Formal render benchmark
  note:
    zh: 已测量：3 个目标各 3 次冷 CLI（整条与渲染段两种口径，输出逐字节一致）、每目标 1 次初始 + 2 次保留渲染器调用（未编码生成，不含编码）、以及 native
      SDK 并发 1/2（共享 runtime 工作线程）逐阶段 3 轮数据（见 lite-avatar-s100/s100p/s600-python-validation.json）。未测量：视频输入的整链路双流并发端到端口径（与
      SDK 工作线程并发属不同口径）。30 fps 为输出视频封装帧率，不代表渲染性能。
    en: Measured — three cold CLI runs per target (whole-CLI and render-phase scopes, byte-identical
      outputs), one initial + two retained-renderer calls per target (unencoded generation,
      excluding encoding), and per-stage native SDK concurrency-1/2 rounds on shared-runtime
      workers (see lite-avatar-s100/s100p/s600-python-validation.json). Not measured — a two-stream
      video-input full-pipeline end-to-end protocol, which differs from the SDK worker concurrency.
      The 30 fps value is the muxed output cadence, not render performance.
