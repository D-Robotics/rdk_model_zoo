    verification:
      zh: S100P（nash-m）实测：3 次冷 CLI 整条 23.674–23.756 s，编码渲染段 18.59–18.68 fps，输出逐字节一致；保留渲染器的 2 次调用为未编码帧生成，均值 28.253
