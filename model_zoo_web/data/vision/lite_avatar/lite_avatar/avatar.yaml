schema_version: 1
profile: sample
id: lite_avatar/lite_avatar/avatar
name: LiteAvatar
domain: vision
source: lite_avatar
provider: HumanAIGC/lite-avatar
family: lite_avatar
task: avatar
task_ids:
- audio-driven-talking-avatar
description:
  zh: 音频驱动的说话数字人管线：由语音特征得到口型参数，以参考图为条件生成人脸并合成到背景，视频经 H.264 硬件编码，FFmpeg 封装 AAC 音轨输出 MP4。
  en: An audio-driven talking-avatar pipeline in which speech features yield mouth-shape
    parameters, reference-conditioned face generation composites the face onto the background, and
    the Python pipeline outputs an MP4 with H.264 hardware-encoded video and FFmpeg-muxed AAC
    audio.
license:
  name: MIT
  url: https://github.com/HumanAIGC/lite-avatar/blob/5b7ec850945e03d56fb290b05fb68440c359fa86/LICENSE
sample_path: samples/vision/lite_avatar
sample_commit: f77bcea4c203f935efbafe0374cb21c9f3d4cd28
pipeline: avatar_pipeline
pipeline_note:
  zh: 语音驱动数字人管线（Python）。音频特征与流程控制在 CPU；encoder、audio2mouth、net_encode、net_decode 四个 INT16 模型在 BPU（S100
    nash-e · S100P nash-m · S600 nash-p；解码器的 FP32 InstanceNorm 归一化子图留在 CPU）；背景解码与输出
    H.264 编码使用 VPU 硬件，AAC 音轨由 FFmpeg 封装。
  en: A speech-driven avatar pipeline (Python). Audio features and orchestration run on the CPU;
    the four INT16 models (encoder, audio2mouth, net_encode, net_decode) run on the BPU (nash-e on
    S100, nash-m on S100P, nash-p on S600; the decoder's FP32 InstanceNorm normalization subgraph
    stays on the CPU); background decode and output H.264 encoding use the VPU hardware, and the
    AAC track is muxed by FFmpeg.
variants:
- size: default
  input_contract:
  - label:
      zh: 输入音频
      en: Input audio
    value:
      zh: WAV，任意采样率（捆绑示例为 16 kHz 单声道 5.55 秒）
      en: WAV at any sample rate (the bundled example is 16 kHz mono, 5.55 s)
  - label:
      zh: 背景视频
      en: Background video
    value:
      zh: 宿主机一次性生成的 bg_video.h264（可见宽 890 填充为编码宽 896 × 1920，30 fps）与 bg_video.json 边车
      en: bg_video.h264 produced by the one-time host preparation (visible width 890 padded to a
        coded 896 x 1920, 30 fps) plus its bg_video.json sidecar
  - label:
      zh: 输出
      en: Output
    value:
      zh: MP4，H.264 High 890 × 1920 yuv420p @ 30 fps + AAC 16 kHz 单声道
      en: MP4, H.264 High 890x1920 yuv420p at 30 fps plus AAC 16 kHz mono
  - label:
      zh: 运行时
      en: Runtime
    value:
      zh: 提供 Python 运行时；未提供 C++ 运行时。
      en: Python runtime available; C++ runtime not provided.
  - label:
      zh: 编码器 encoder（每个语句窗口一次）
      en: Encoder (once per utterance window)
    value:
      zh: 输入 [1,400,560]（NTF：400 个 LFR 特征 × 560 维 fbank 特征，LFR 步进 60 ms，约对应 24 秒音频）→ 输出 [1,400,50,512]（第 3 维为 50 个编码器层、512 隐藏维）；参数 157,974,624（导出图学习张量口径）；142.4973824 GFLOPs／每次窗口调用（FLOPs = 2×MACs）。
      en: Input [1,400,560] (NTF — 400 LFR features x 560-dim fbank features at a 60 ms LFR step,
        spanning ~24 s of audio) -> output [1,400,50,512] (axis 3 = 50 stacked encoder layers,
        512-dim hidden); 157,974,624 parameters (exported-graph learned tensors); 142.4973824
        GFLOPs per window call (FLOPs = 2 x MACs).
  - label:
      zh: 音频到嘴型 audio2mouth（滑窗调用）
      en: Audio2Mouth (sliding-window calls)
    value:
      zh: 输入 [1,30,50,512]（批量 × 30 视频帧 × 50 编码器层 × 512）→ 输出 [1,30,32] 嘴型参数（另有运行时未使用的 [1,30,256] 辅助特征）；参数 32,599,456（上游 ONNX 导出图学习张量）；1.9516416 GFLOPs／每次滑窗调用（1 秒窗，标称步进 0.4 秒 = 12 帧，尾部重锚；捆绑 166 帧示例共 13 次调用）。
      en: Input [1,30,50,512] (batch x 30 video frames x 50 encoder layers x 512) -> output
        [1,30,32] mouth parameters (plus a runtime-unused [1,30,256] aux feat); 32,599,456
        parameters (upstream ONNX exported-graph learned tensors); 1.9516416 GFLOPs per
        sliding-window call (1 s window, nominal 0.4 s = 12-frame advance, tail re-anchor;
        13 calls for the bundled 166-frame example).
  - label:
      zh: 参考帧编码 net_encode（初始化时一次）
      en: Reference encoder net_encode (once at init)
    value:
      zh: 输入 [1,3,384,384] RGB → 输出 4 层特征金字塔 f0–f3；参数 3,342（训练源 TorchScript 口径）；0.02838528 GFLOPs／每个参考帧（渲染器初始化时计算一次并全程复用）。
      en: Input [1,3,384,384] RGB -> 4-level feature pyramid f0-f3; 3,342 parameters (trained
        TorchScript source); 0.02838528 GFLOPs per reference frame (computed once at renderer
        init and reused for every output frame).
  - label:
      zh: 逐帧解码 net_decode（每输出帧一次）
      en: Frame decoder net_decode (once per output frame)
    value:
      zh: 输入 f0–f3 金字塔 + [1,32] 嘴型参数 → 输出 [1,3,384,384] 嘴部图像；参数 244,764（训练源口径，不含 2,560 个非学习的替换反卷积权重）；2.00681472 GFLOPs／每输出帧（30 fps）。
      en: Input f0-f3 pyramid + [1,32] mouth parameters -> [1,3,384,384] mouth image; 244,764
        parameters (trained source, excluding the 2,560 non-learned replacement ConvTranspose
        weights); 2.00681472 GFLOPs per output frame at 30 fps.
  - label:
      zh: 计算量口径
      en: Compute accounting
    value:
      zh: 各 GFLOPs 均按 FLOPs = 2×MACs 统计该组件每次调用中的 Conv/ConvTranspose/Gemm/MatMul；整条管线的计算量取决于音频长度决定的滑窗次数与参考帧缓存（net_encode 仅初始化时执行一次）。
      en: Each GFLOPs figure counts Conv/ConvTranspose/Gemm/MatMul at FLOPs = 2 x MACs for one call
        of that component under its stated cadence; total pipeline work depends on the window
        count set by the audio length and on the cached reference features (net_encode runs once
        at renderer init).
  platforms:
  - platform: s100
    status: available
    runtimes:
    - python
    model_availability:
      status: manual-compile
      note:
        zh: 四个 INT16 HBM（encoder 400×560、audio2mouth 30×50×512、net_encode 384×384、net_decode 384×384）无公开下载；按模型准备指南本地打包或用
          OpenExplorer 自编译 nash-e 版本（含 12 个 SHA-256 指纹与 am.mvn 校验）。上游代码 MIT；上游未声明预训练权重许可证，权重需自行获取。
        en: The four INT16 HBMs (encoder 400x560, audio2mouth 30x50x512, net_encode 384x384,
          net_decode 384x384) have no public download; prepare them from a local bundle or
          self-compile the nash-e set with OpenExplorer per the model preparation guide (12 SHA-256
          digests plus the am.mvn check). The upstream code is MIT while the upstream declares no
          license for the pretrained weights, which users must obtain themselves.
      guide_url: https://github.com/D-Robotics/rdk_model_zoo/tree/f77bcea4c203f935efbafe0374cb21c9f3d4cd28/samples/vision/lite_avatar/model
    verification:
      zh: S100（nash-e）实测：3 次冷 CLI 整条 29.373–32.152 s，编码渲染段 14.5–15.21 fps，输出逐字节一致；保留渲染器的 2 次调用为未编码帧生成，均值 21.873
        fps（不含音频特征、初始化与编码）。结构化验证覆盖 80 个标定输入、187 个输出，全部有限且形状一致，4 阶段余弦门通过；166 帧全量对比 pre-encode 全帧 PSNR 57.6626（ROI
        46.1668）、post-encode 组合路径全帧 PSNR 45.155，方法为 PSNR 相似度，非唇形同步精度或真值。提供 Python 运行时，未提供 C++ 运行时；逐阶段 SDK
        吞吐（inf/s）与完整协议见 sample-evidence/lite-avatar-s100-python-validation.json。
      en: Measured on an S100 (nash-e) board — three cold CLI runs take 29.373–32.152 s whole-CLI at a 14.5–15.21
        fps encoded render phase with byte-identical outputs; the two retained-renderer calls do unencoded frame
        generation at a 21.873 fps mean (excluding the audio-features phase, renderer init and encoding).
        Structured validation covers 80 calibration inputs and 187 outputs, all finite with equal shapes, and the
        four-stage cosine gate passes; the full 166-frame comparison reaches pre-encode full-frame PSNR 57.6626
        (ROI 46.1668) and combined-path post-encode full-frame PSNR 45.155 — PSNR similarity, not lip-sync
        accuracy or ground truth. Python runtime is provided; C++ runtime is not provided. Per-stage SDK
        throughput (inferences/s) and full protocols ship in
        sample-evidence/lite-avatar-s100-python-validation.json.
    evidence:
    - label:
        zh: 板端运行证据摘要
        en: Board run evidence summary
      url: sample-evidence/lite-avatar-s100.json
    - label:
        zh: Python 运行时逐阶段验证数据
        en: Python runtime per-stage validation data
      url: sample-evidence/lite-avatar-s100-python-validation.json
    - label:
        zh: 组件参数量与算力元数据
        en: Component parameter and compute metadata
      url: sample-evidence/lite-avatar-components.json
    quickstart:
    - title:
        zh: 宿主机一次性：下载并校验上游示例数据
        en: 'Host, one-time: download and verify the upstream sample data'
      command: wget https://github.com/HumanAIGC/lite-avatar/raw/5b7ec850945e03d56fb290b05fb68440c359fa86/data/sample_data.zip
    - title:
        zh: 宿主机一次性：校验并解压到示例目录
        en: 'Host, one-time: verify and unpack into the sample directory'
      command: echo 'd1c77b2df48b7fd7f19e6eef52bc5107e3131dd9777162faf2576f9451f69d7b  sample_data.zip'
        | shasum -a 256 -c - && unzip sample_data.zip -d samples/vision/lite_avatar/test_data/
    - title:
        zh: 宿主机一次性：转码背景视频（生成 bg_video.h264 + bg_video.json）
        en: 'Host, one-time: prepare the background video (writes bg_video.h264 and bg_video.json)'
      command: python3 samples/vision/lite_avatar/test_data/prepare_background.py --data samples/vision/lite_avatar/test_data/preload
    - title:
        zh: 宿主机 → 板端：把预生成的 preload 目录（bg_video.h264、bg_video.json、ref_frames/、face_box.txt）拷贝到板端 test_data/preload
        en: 'Host to board: copy the prepared preload directory (bg_video.h264, bg_video.json,
          ref_frames/, face_box.txt) to the board''s sample test_data/preload before the on-board
          steps'
      command: rsync -av samples/vision/lite_avatar/test_data/preload/ <board-user>@<board-host>:<board-repo>/samples/vision/lite_avatar/test_data/preload/
    - title:
        zh: 板端：校验四个模型文件（S100）
        en: 'On board: verify the four model artifacts (S100)'
      command: python3 samples/vision/lite_avatar/model/verify.py --target s100
    - title:
        zh: 板端：渲染捆绑示例语音（S100）
        en: 'On board: render the bundled example utterance (S100)'
      command: bash samples/vision/lite_avatar/runtime/python/run.sh --target s100 --audio samples/vision/lite_avatar/test_data/asr_example.wav
