missing:
- field: warmed-render-benchmark
  status: missing
  title:
    zh: 正式渲染基准
    en: Formal render benchmark
  note:
    zh: 现有数据为单次示例测量（渲染段与整条 CLI 两种口径均已记录）；预热后多次运行的均值与波动、以及并发口径未测量。30 fps 为输出视频封装帧率，不代表渲染性能。
    en: The recorded numbers come from single example measurements (both the render-phase and
      whole-CLI scopes); warmed repeated-run means and variance, and any concurrency protocol, are
      not measured. The 30 fps value is the muxed output cadence, not render performance.
- field: float-vs-board-quality
  status: missing
  title:
    zh: 浮点与板端全量质量对比
    en: Full float-vs-board quality
  note:
    zh: 已收录：PTQ 模拟 FP32 对比套件（各阶段示例数 3/17/30/30）、S100P 与 S600 板端 4 阶段对 FP32 单样本余弦相似度达标（门限
      0.95）、音频前端特征 3 组逐位一致。本站尚未收录：S100 对应的板端阶段记录、全量帧级浮点对板端 PSNR/MAE 对比与唇形同步评测；唇形同步需单独的评测方法（随示例提供的帧评测器仅计算
      PSNR/MAE）。
    en: Collected here are the PTQ-simulation FP32 comparison suite (3/17/30/30 examples per
      stage), single-sample 4-stage BPU-vs-FP32 cosine similarity passing the 0.95 gate on S100P
      and S600, and bitwise-equal audio-frontend features in 3 cases. Not yet collected on this
      site are the matching S100 on-board stage records, a full frame-level float-vs-board
      PSNR/MAE comparison and a lip-sync evaluation; lip sync needs its own method (the shipped
      frame evaluator computes PSNR/MAE only).
- field: model-size-and-compute
  status: missing
  title:
    zh: 四阶段模型参数量与计算量
    en: Per-stage parameters and compute
  note:
    zh: 四个组件模型在各自的分块/逐帧输入口径下尚无已登记的 parameter_count/GFLOPs 数值，本站未收录，也不以估算值代替；与已发布模型的正式标准对齐前需实测补齐。
    en: No registered parameter_count/GFLOPs figures exist for the four component models under
      their explicit per-block/per-frame input contracts; they are not collected on this site and
      no estimates stand in. Measured values are required before full alignment with the published
      released-model standards.
- field: oe-conversion-reports
  status: missing
  title:
    zh: OE 转换报告
    en: OE conversion reports
  note:
    zh: 四个 HBM 由用户本地编译，OE HTML 转换报告未在本站收录。
    en: The four HBMs are compiled locally by users; no OE HTML conversion report is catalogued on
      this site.
- field: published-model-downloads
  status: missing
  title:
    zh: 公开模型下载
    en: Public model downloads
  note:
    zh: 无稳定公开下载地址；四个 HBM 按固定版本的模型准备指南本地打包或自编译，SHA-256 指纹亦见该指南。
    en: There is no stable public download; the four HBMs are prepared from a local bundle or
      self-compiled per the pinned preparation guide, which also carries their SHA-256 digests.
- field: cpp-runtime
  status: not-applicable
  title:
    zh: C++ 运行时
    en: C++ runtime
  note:
    zh: 本示例仅提供 Python 运行时，无 C++ 端到端口径。
    en: This sample ships a Python runtime only; no C++ end-to-end protocol applies.
