name: LaneNet
domain: vision
source: lanenet
family: lanenet
task: lane
description:
  zh: LaneNet 通过二值分割分支预测车道像素，通过嵌入分支学习区分车道实例的特征。本示例提供 RDK S100 的 Python 与 C++ 推理，输出二值标签和原始嵌入。
  en: LaneNet predicts lane pixels with a binary segmentation branch and learns embedding features for lane-instance separation. This sample exposes binary labels and raw embeddings through Python and C++ inference on RDK S100.
