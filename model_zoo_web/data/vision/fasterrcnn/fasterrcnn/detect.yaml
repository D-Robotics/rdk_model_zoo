description:
  zh: Faster R-CNN 用区域提议网络和区域分类头做目标检测。该示例运行 MobileNetV3-Large-FPN 骨干，BPU 负责骨干与框头，CPU
    负责提议筛选和 RoIAlign。
  en: TorchVision Faster R-CNN uses a region proposal network and a region classification
    head for COCO object detection. This sample runs the MobileNetV3-Large-320-FPN
    model and adds ByteTrack person tracking for video. The backbone/RPN and box head
    run on BPU; CPU handles proposal selection, RoIAlign and tracking.
