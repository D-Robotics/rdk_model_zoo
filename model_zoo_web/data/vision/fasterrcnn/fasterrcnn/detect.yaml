schema_version: 1
profile: sample
id: fasterrcnn/fasterrcnn/detect
name: Faster R-CNN (MobileNetV3-Large 320-FPN)
domain: vision
source: fasterrcnn
provider: torchvision
family: fasterrcnn
task: detect
task_ids:
- object-detection
- multi-object-tracking
description:
  zh: torchvision COCO 预训练的两阶段 Faster R-CNN 检测器（MobileNetV3-Large 320 骨干 + FPN）。骨干/RPN 与检测头拆分为 PartA / PartB 两个 BPU 图，中间的候选框选择与 RoI 对齐在 CPU 上运行；视频模式下附带 ByteTrack 行人跟踪。
  en: A two-stage Faster R-CNN detector from torchvision COCO weights (MobileNetV3-Large 320 backbone with FPN). The backbone/RPN and the box head are exported as the PartA and PartB BPU graphs, with proposal selection and RoI alignment running on the CPU between them; video mode adds ByteTrack person tracking.
license:
  name: BSD-3-Clause
  url: https://github.com/pytorch/vision/blob/main/LICENSE
sample_path: samples/vision/fasterrcnn
sample_commit: c8eb9d56264fbaf8f78265139d053e027bd32b28
artifact_descriptor: samples/vision/fasterrcnn/model/frcnn_mbv3_320.json
pipeline: neural_detector
pipeline_note:
  zh: PartA（NV12 输入，骨干 + RPN 特征）与 PartB（RoI 对齐后的 float32 池化特征，分类与回归）在 BPU 上运行；CPU 侧完成 150 个候选框的选择与 RoI 对齐，最终输出检测框、类别与分数。
  en: PartA (NV12 input, backbone and RPN features) and PartB (float32 pooled features after RoI alignment, classification and regression) run on the BPU; the CPU selects among the 150 proposals and performs RoI alignment, and the final output is detection boxes, classes and scores.
variants:
- size: mbv3-320
  input_contract:
  - label:
      zh: 输入尺寸
      en: Input size
    value:
      zh: 320 × 320 letterbox
      en: 320x320 letterbox
  - label:
      zh: Runtime 输入
      en: Runtime input
    value:
      zh: NV12（X5 packed / S100 · S100P · S600 split，bt.601 limited）
      en: NV12 (packed on X5, split on S100/S100P/S600, bt.601 limited)
  - label:
      zh: 输出
      en: Output
    value:
      zh: 检测框、类别与置信度（PartB 原始输出为 150 候选框 × 91 类 logits 与 364 维框回归，经 CPU 后处理解码）
      en: Detection boxes, classes and confidences (PartB's raw output is 150 proposals x 91-class logits plus 364-d box regression, decoded by CPU post-processing)
