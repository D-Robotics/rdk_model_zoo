task: track
description:
  zh: 该示例在 Faster R-CNN 检测结果之后接上 ByteTrack，对视频中的行人保持跨帧身份。检测器与跟踪器是同一示例里的两段流程。
  en: 'TorchVision Faster R-CNN uses a region proposal network and a region classification head for COCO object detection. This sample runs the MobileNetV3-Large-320-FPN model and adds ByteTrack person tracking for video. The backbone/RPN and box head run on BPU; CPU handles proposal selection, RoIAlign and tracking.'
