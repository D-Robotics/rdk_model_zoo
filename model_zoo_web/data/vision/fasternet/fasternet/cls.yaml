description:
  zh: FasterNet 是围绕一个核心思想设计的轻量 CNN 系列：追求更高的*有效* FLOPS（实际每秒计算量），而不是只压低理论 FLOPs。其核心算子部分卷积 （PConv）只对输入通道的一部分做空间卷积、其余通道保持不动，从而减少冗余访存，提升边缘设备上的实际运行效率。面向 ImageNet-1k 1000 类分类。 四项核心特性：
  en: 'FasterNet is a lightweight CNN family designed around one idea: chase a higher *effective* FLOPS (actual computed operations per second) instead of only minimizing theoretical FLOPs. Its core operator, partial convolution (PConv), applies the spatial convolution to only a fraction of the input channels and leaves the rest untouched, cutting redundant memory access and improving practical runtime efficiency on edge devices. It targets ImageNet-1k 1000-class classification. Four feature highlights:'
