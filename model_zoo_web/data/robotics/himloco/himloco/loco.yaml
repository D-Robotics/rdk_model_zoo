description:
  zh: HIMLoco 从六帧 45 维观测估计内部状态，输出 12 维策略动作。本例使用 [himloco_lab](https://github.com/IsaacZH/himloco_lab) 导出的融合 estimator／actor， 该项目是 [HIMLoco](https://github.com/OpenRobotLab/HIMLoco) 的 Isaac Lab 实现。 独立训练的检查点不能互换。
  en: HIMLoco estimates internal state from six 45-value observations and produces 12 policy actions. This sample uses the fused estimator/actor exported by [himloco_lab](https://github.com/IsaacZH/himloco_lab), an Isaac Lab implementation of [HIMLoco](https://github.com/OpenRobotLab/HIMLoco). Independently trained checkpoints are not interchangeable.
