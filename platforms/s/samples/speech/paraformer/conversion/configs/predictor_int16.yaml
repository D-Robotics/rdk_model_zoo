# Predictor INT16 hb_compile config (S100 / nash-e)
#
# Prerequisites:
#   - ./predictor_only.onnx (produced by scripts/07_extract_predictor.py)
#   - ./real_calib/encoder_after_norm_Add_1_output_0/*.npy
#     (produced by scripts/10_gen_real_calib.py — must use REAL FP32 encoder output,
#      NOT random data, or INT16 will collapse)
#
# Run:
#   hb_compile -c predictor_int16.yaml
#
# Produces:
#   ./predictor_int16_output/predictor_int16.hbm             (~4 MB, ~0.35 ms)
#   ./predictor_int16_output/predictor_int16_ptq_model.onnx  (for CER eval)

model_parameters:
  onnx_model: ./predictor_only.onnx
  march: nash-e
  output_model_file_prefix: predictor_int16
  working_dir: ./predictor_int16_output

input_parameters:
  input_name: /encoder/after_norm/Add_1_output_0
  input_shape: 1x400x512
  input_type_rt: featuremap
  input_type_train: featuremap
  input_layout_train: NCHW
  separate_batch: false

calibration_parameters:
  cal_data_dir: ./real_calib/encoder_after_norm_Add_1_output_0
  calibration_type: max
  quant_config:
    model_config:
      all_node_type: int16
      activation:
        calibration_type: max

compiler_parameters:
  optimize_level: O2
  compile_mode: latency
  core_num: 1
  jobs: 32
  cache_mode: disable
